<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Precios - Coffee Clhoe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4c0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #8b6f47;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #2c2c2c;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: #f5f5f5;
            padding: 15px 25px;
            border-radius: 8px;
            border-left: 4px solid #8b6f47;
        }

        .stat strong {
            color: #8b6f47;
            font-size: 1.3em;
        }

        .stat span {
            color: #999;
            font-size: 0.9em;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .product-card {
            background: #fafafa;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #f0f0f0;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: #8b6f47;
            box-shadow: 0 8px 25px rgba(139, 111, 71, 0.15);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            color: #999;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
        }

        .product-info {
            padding: 20px;
        }

        .product-id {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .product-tag {
            background: #e8d4c0;
            color: #8b6f47;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .product-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .product-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .product-input input:focus {
            outline: none;
            border-color: #8b6f47;
        }

        .product-input button {
            padding: 12px 16px;
            background: #8b6f47;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .product-input button:hover {
            background: #6b5635;
        }

        .product-input button:active {
            transform: scale(0.95);
        }

        .product-status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9em;
            text-align: center;
            font-weight: 600;
        }

        .status-saved {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 3px solid #8b6f47;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #8b6f47;
            color: white;
        }

        .btn-primary:hover {
            background: #6b5635;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 111, 71, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            border-color: #8b6f47;
            color: #8b6f47;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0d8bcc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            color: #0d8bcc;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .info-box p {
            color: #333;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6f47, #a0886d);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

        // Inicializar
        let prices = JSON.parse(localStorage.getItem("clhoe_prices")) || {};

        function renderProducts() {
            productsGrid.innerHTML = "";
            productsWithoutPrice.forEach(product => {
                const saved = prices[product.id] || "";
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="Producto ${product.id}" onerror="this.parentElement.textContent='Sin imagen'">
                    </div>
                    <div class="product-info">
                        <div class="product-id">ID: ${product.id}</div>
                        <div class="product-tags">
                            ${product.tags.map(tag => `<span class="product-tag">${tag}</span>`).join("")}
                        </div>
                        <div class="product-input">
                            <input 
                                type="number" 
                                id="price-${product.id}" 
                                value="${saved}" 
                                placeholder="Precio" 
                                min="0"
                                onkeypress="if(event.key === 'Enter') savePrice(${product.id})"
                            >
                            <button onclick="savePrice(${product.id})">✓</button>
                        </div>
                        <div class="product-status ${saved ? 'status-saved' : 'status-pending'}">
                            ${saved ? `💾 ${new Intl.NumberFormat('es-CO').format(saved)}` : "⏳ Pendiente"}
                        </div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
            updateStats();
        }

        function savePrice(productId) {
            const input = document.getElementById(`price-${productId}`);
            const value = parseInt(input.value) || 0;
            
            if (value > 0) {
                prices[productId] = value;
                localStorage.setItem("clhoe_prices", JSON.stringify(prices));
                renderProducts();
            } else {
                alert("Por favor ingresa un precio válido");
            }
        }

        function updateStats() {
            const completed = Object.keys(prices).length;
            const total = productsWithoutPrice.length;
            const percentage = (completed / total) * 100;

            completedCount.textContent = completed;
            progressFill.style.width = percentage + "%";
        }

        function exportToCSV() {
            let csv = "ID,Precio\n";
            Object.entries(prices).forEach(([id, price]) => {
                csv += `${id},${price}\n`;
            });

            if (Object.keys(prices).length === 0) {
                alert("No hay precios guardados para exportar");
                return;
            }

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `precios_clhoe_${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }

        function reload() {
            location.reload();
        }

        function clearAll() {
            if (confirm("¿Estás seguro de que quieres borrar TODOS los precios guardados?")) {
                localStorage.removeItem("clhoe_prices");
                prices = {};
                renderProducts();
            }
        }

        // Event listeners
        exportBtn.addEventListener("click", exportToCSV);
        reloadBtn.addEventListener("click", reload);
        clearBtn.addEventListener("click", clearAll);

        // Inicializar en cargar
        renderProducts();
    </script>
</body>
</html>
